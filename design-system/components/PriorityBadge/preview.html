<!-- @dsCard group="Labels" height=210 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PriorityBadge</title></head>
<body>
<div class="ds-pad"><div class="ds-row"><span class="pb p0">P0</span><span class="pb p1">P1</span><span class="pb p2">P2</span></div>
<div class="grid g3"><div class="prio" style="--c:var(--p0)"><span class="pt"><span class="pb p0">P0</span>Launch blockers</span><p>Measured, alerting and owned before go-live.</p><span class="rule">no launch without these</span></div>
<div class="prio" style="--c:var(--p1)"><span class="pt"><span class="pb p1">P1</span>Core health</span><p>Measured from launch and reviewed weekly.</p><span class="rule">weekly review</span></div>
<div class="prio" style="--c:var(--p2)"><span class="pt"><span class="pb p2">P2</span>Optimisation</span><p>Added once the bot is stable.</p><span class="rule">monthly / quarterly</span></div></div></div>
</body>
</html>
